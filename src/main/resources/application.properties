spring.application.name=certifyme-backend

server.port=8081

spring.datasource.url=${CERTIFYME_DB_URL:jdbc:mysql://localhost:3306/certifyme_db}
spring.datasource.username=${CERTIFYME_DB_USERNAME:certifyme_user}
spring.datasource.password=${CERTIFYME_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.error.include-message=always
